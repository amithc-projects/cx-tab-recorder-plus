<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>File Manager — ZumiLabs OmniCapt</title>
  <!-- Maps the docMentis bare specifier to the vendored ESM files.
       Must appear before any module scripts. The WASM (~18 MB) is a separate
       binary file and is only fetched when an Office file is first previewed. -->
  <script type="importmap">
    {"imports":{"@docmentis/udoc-viewer":"./vendor/docmentis/index.js"}}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Inter', sans-serif; background: #111827; color: #F9FAFB; display: flex; flex-direction: column; }

    .header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      background: #1F2937;
      border-bottom: 1px solid #374151;
      flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .header-divider { width: 1px; height: 20px; background: #374151; flex-shrink: 0; }

    .folder-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .folder-label { font-size: 11px; color: #6B7280; white-space: nowrap; }
    .folder-name { font-size: 13px; font-weight: 600; color: #93C5FD; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-path { font-size: 11px; color: #6B7280; margin-left: 4px; }

    #btnGrantAccess, #btnSendToCloud {
      display: none;
      background: #2563EB; color: white; border: none;
      padding: 6px 14px; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; white-space: nowrap; flex-shrink: 0;
      transition: background 0.15s;
    }
    #btnGrantAccess:hover, #btnSendToCloud:hover:not(:disabled) { background: #1D4ED8; }
    #btnSendToCloud:disabled { background: #374151; color: #6B7280; cursor: not-allowed; }
    #btnSendToCloud .count {
      background: rgba(255,255,255,0.2); border-radius: 999px;
      padding: 1px 7px; margin-left: 6px; font-size: 11px;
    }

    /* Modal */
    #stcDialog {
      border: none; padding: 0; border-radius: 12px;
      background: #1F2937; color: #F9FAFB; max-width: 640px; width: 92vw;
    }
    #stcDialog::backdrop { background: rgba(0,0,0,0.6); }
    #stcDialog header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid #374151;
    }
    #stcDialog header h2 { font-size: 14px; font-weight: 600; flex: 1; margin: 0; }
    #stcDialog .close-btn {
      background: none; border: none; color: #9CA3AF;
      font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px;
    }
    #stcDialog .close-btn:hover { color: #F87171; }
    #stcDialog .body { padding: 14px 18px 18px; max-height: 70vh; overflow-y: auto; }
    #stcDialog zumilabs-cloudsend {
      --cloudsend-bg:          #1F2937;
      --cloudsend-text:        #F9FAFB;
      --cloudsend-muted:       #9CA3AF;
      --cloudsend-border:      #374151;
      --cloudsend-accent:      #3B82F6;
      --cloudsend-accent-fg:   #FFFFFF;
      --cloudsend-accent-soft: rgba(59, 130, 246, 0.15);
      --cloudsend-row-hover:   #374151;
      --cloudsend-row-alt:     #111827;
      --cloudsend-chip:        #374151;
      --cloudsend-chip-hover:  #4B5563;
      --cloudsend-disabled-bg: #374151;
      --cloudsend-disabled-fg: #6B7280;
    }
    #stcDialog .stc-error {
      padding: 10px 14px; border-radius: 6px;
      background: #1F1010; color: #F87171;
      border: 1px solid #7F1D1D;
      font-size: 13px;
    }

    #noFolderWarning {
      display: none;
      align-items: center; gap: 10px;
      flex: 1;
    }
    .warn-text { font-size: 13px; color: #F87171; }
    .warn-link {
      font-size: 12px; color: #93C5FD; cursor: pointer;
      text-decoration: underline; white-space: nowrap;
    }

    #statusBar {
      display: none;
      font-size: 11px; color: #F87171;
      padding: 6px 16px;
      background: #1F1010;
      border-bottom: 1px solid #7F1D1D;
      flex-shrink: 0;
    }

    .component-container {
      flex: 1; width: 100%; overflow: hidden;
    }
    sidekick-manager {
      display: block; width: 100%; height: 100%;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <img src="icons/icon128.png" width="22" height="22" style="display:block;">
      File Manager
    </div>
    <div class="header-divider"></div>

    <div class="folder-info" id="folderInfoBar" style="display:none;">
      <span class="folder-label">Folder:</span>
      <span class="folder-name" id="folderNameDisplay"></span>
      <span class="folder-path" id="folderPathDisplay"></span>
    </div>

    <div id="noFolderWarning">
      <span class="warn-text">No save folder configured.</span>
      <span class="warn-link" id="btnGoToSettings">Open Settings</span>
    </div>

    <button id="btnGrantAccess">Grant access to folder</button>
  </div>

  <div id="statusBar"></div>

  <div class="component-container">
    <sidekick-manager></sidekick-manager>
  </div>

  <dialog id="stcDialog">
    <header>
      <h2 id="stcDialogTitle">Send to Cloud</h2>
      <button class="close-btn" id="stcDialogClose" aria-label="Close">×</button>
    </header>
    <div class="body" id="stcDialogBody">
      <!-- zumilabs-cloudsend component injected here at open time -->
    </div>
  </dialog>

  <script src="sidekick-manager.iife.js"></script>
  <script src="vendor/cloudsend.js"></script>
  <script src="filemanager.js"></script>
</body>
</html>
